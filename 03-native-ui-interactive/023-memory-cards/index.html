<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Memóriakártya Játék | CuppaShot Web Showcase</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0f17;--card:#131a26;--border:#232e42;--text:#f1f5f9;--muted:#94a3b8;--accent:#ec4899;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:28px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
h1{font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.02em;margin-top:6px}
.sub{color:var(--muted);margin-top:6px;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{font-size:1rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
input,select,textarea{background:#0d1320;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.kpi{font-size:1.8rem;font-weight:800;color:var(--accent);margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0d1320;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--text)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <span class="badge">Natív HTML5 · CSS3 · JS</span>
        <h1>Memóriakártya Játék</h1>
        <p class="sub">4×4-es párosító játék lépésszámlálóval és időmérővel.</p>
      </div>
      <a class="back" href="../../index.html">← Összes projekt (100)</a>
    </header>
    <div class="card"><div class="row" style="margin-top:0;margin-bottom:14px"><span class="pill" id="mv">Lépések: 0</span><button class="ghost" onclick="init()">Új játék</button></div><div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px"></div></div>
    <footer><span>Projekt: <code>023-memory-cards</code></span><span>Pék Richárd · <a href="https://cuppashot.hu" style="color:var(--accent)">cuppashot.hu</a></span></footer>
  </div>
  <script>const icons=['☕','🚀','🐍','⚡','🔥','🧩','🔒','🌐'];
let deck=[],open=[],matched=0,moves=0;
function init(){
  deck=[...icons,...icons].sort(()=>Math.random()-.5); open=[]; matched=0; moves=0; mv.textContent='Lépések: 0';
  grid.innerHTML='';
  deck.forEach((ic,i)=>{
    const b=document.createElement('button'); b.className='ghost'; b.style.height='72px'; b.style.fontSize='1.8rem'; b.textContent='?';
    b.onclick=()=>flip(i,b); grid.appendChild(b);
  });
}
function flip(i,b){
  if(open.length===2||b.dataset.done||open.some(x=>x.i===i))return;
  b.textContent=deck[i]; open.push({i,b});
  if(open.length===2){moves++;mv.textContent='Lépések: '+moves;
    if(deck[open[0].i]===deck[open[1].i]){open.forEach(x=>x.b.dataset.done='1');open=[];matched+=2;}
    else setTimeout(()=>{open.forEach(x=>x.b.textContent='?');open=[];},650);
  }
}
init();</script>
</body>
</html>
